name: Collect RSS

on:
  schedule:
    - cron: "0 */2 * * *" # 2시간 간격
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect-rss
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: node scripts/collect.js

      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/articles-cache.json; then
            echo "no changes"
          else
            git add data/articles-cache.json
            git commit -m "chore: update articles cache [skip ci]"
            git push
          fi
