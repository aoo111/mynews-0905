<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MyNews</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="hero">
  <div class="hero-top">
    <span class="hero-mark">MN</span>
    <button id="hero-menu-btn" class="hero-menu-btn" type="button" aria-label="사이트 추가">☰</button>
  </div>

  <h1 class="hero-title">MyNews</h1>
  <p class="hero-subtitle">관심 뉴스를 자동으로 모아 한 곳에서 보여드립니다</p>
</header>

<main class="content">
  <div class="toolbar">
    <input id="search-input" class="search-input" type="search" placeholder="사이트명 또는 기사 제목 검색" />
    <label class="switch-label">
      <input type="checkbox" id="translate-toggle" />
      <span class="switch"></span>
      한국어 번역
    </label>
  </div>

  <div id="add-form-panel" class="add-form-panel" hidden>
    <div>
      <h4>RSS 피드 추가</h4>
      <p class="hint">기사 자동 수집 대상입니다.</p>
      <form id="rss-form" class="add-form">
        <label>사이트명
          <input type="text" name="name" placeholder="예: 한국경제 경제" required />
        </label>
        <label>대분류
          <input type="text" name="category" list="category-options" placeholder="예: 경제·산업" required />
        </label>
        <label>세부분류
          <input type="text" name="subcategory" placeholder="예: 경제뉴스" required />
        </label>
        <label>RSS 피드 주소
          <input type="url" name="url" placeholder="https://example.com/rss" required />
        </label>
        <button type="submit">RSS 추가</button>
      </form>
    </div>

    <div>
      <h4>일반 웹사이트 추가</h4>
      <p class="hint">자동 수집하지 않습니다. 바로가기 / 추후 크롤링 대상으로만 저장됩니다.</p>
      <form id="website-form" class="add-form website">
        <label>사이트명
          <input type="text" name="name" placeholder="예: DART 전자공시시스템" required />
        </label>
        <label>대분류
          <input type="text" name="category" list="category-options" placeholder="예: 증권·기업정보" required />
        </label>
        <label>세부분류
          <input type="text" name="subcategory" placeholder="예: 기업공시" required />
        </label>
        <label>웹사이트 주소
          <input type="url" name="url" placeholder="https://example.com" required />
        </label>
        <button type="submit">웹사이트 추가</button>
      </form>
    </div>
  </div>

  <datalist id="category-options"></datalist>

  <div class="view-layout">
    <aside class="sidebar-column">
      <nav class="sidebar-nav">
        <button class="category-nav-btn active" data-view="feed" type="button">📰 최신 뉴스</button>
        <button class="category-nav-btn" data-view="sites" type="button">🗂️ 사이트 모음</button>
        <button id="hero-add-btn" class="category-nav-btn" type="button">➕ 사이트 추가</button>
      </nav>
      <div id="category-sidebar" class="category-sidebar"></div>
    </aside>
    <div class="view-main">
      <div id="content-header" class="content-header"></div>
      <div id="content-body"></div>
    </div>

    <div id="right-column" class="right-column">
      <aside class="calendar-panel">
        <div class="calendar-header">
          <button id="calendar-prev" class="calendar-nav-btn" type="button" aria-label="이전 달">‹</button>
          <span id="calendar-month-label" class="calendar-month-label"></span>
          <button id="calendar-next" class="calendar-nav-btn" type="button" aria-label="다음 달">›</button>
        </div>
        <div class="calendar-weekdays">
          <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
        </div>
        <div id="calendar-grid" class="calendar-grid"></div>
        <button id="calendar-clear" class="calendar-clear-btn" type="button" hidden>날짜 필터 해제</button>
      </aside>

      <aside class="trending-panel">
        <div class="trending-header">
          <h3 class="trending-title">🔥 인기 검색어</h3>
          <div class="trending-tabs">
            <button class="trending-tab active" data-scope="domestic" type="button">국내</button>
            <button class="trending-tab" data-scope="global" type="button">글로벌</button>
          </div>
        </div>
        <ol id="trending-list" class="trending-list"></ol>
      </aside>
    </div>
  </div>
</main>

<div id="article-modal" class="modal-overlay" hidden>
  <div class="modal-card">
    <button id="modal-close" class="modal-close" type="button" aria-label="닫기">✕</button>
    <div class="modal-meta">
      <span id="modal-date"></span>
      <span id="modal-source"></span>
    </div>
    <div id="modal-keywords" class="modal-keywords"></div>
    <div id="modal-image-wrap" class="modal-image-wrap"></div>
    <h2 id="modal-title" class="modal-title"></h2>
    <p id="modal-summary" class="modal-summary"></p>
    <a id="modal-link" class="modal-link" target="_blank" rel="noopener noreferrer">원문 보기 →</a>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
